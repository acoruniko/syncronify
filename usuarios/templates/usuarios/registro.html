<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Usuario - Syncronify</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'usuarios/css/login.css' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/logo-icon.png' %}">
</head>
<body>
    <div class="login-container">
        <div class="logo-container">
            <img src="{% static 'usuarios/img/logo_banner.png' %}" alt="Logo Syncronify" class="logo-banner">
        </div>

        {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <p class="{{ message.tags }}">{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" novalidate>
            {% csrf_token %}
            
            <label for="username">Nombre de usuario</label>
            {{ form.username }}

            <label for="nombre_completo">Nombre Completo</label>
            {{ form.nombre_completo }}

            <label for="password">Contraseña</label>
            {{ form.password }}

            <label for="confirmar_password">Confirmar Contraseña</label>
            {{ form.confirmar_password }}

            <div class="form-actions" style="display: flex; gap: 10px;">
                <button type="submit" style="flex: 1;">Crear</button>
                <button type="button" class="btn-cancel" onclick="window.location.href='{% url 'login' %}'" style="flex: 1;">
                    Cancelar
                </button>
            </div>
        </form>
    </div>
</body>
</html>
